{% extends "base.html" %}

{% block title %}Book Appointment – MedTrack{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px; padding-top: 2rem; padding-bottom: 3rem;">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span>📅</span> Book a Medical Consultation
      </div>
      <a href="{{ url_for('view_appointments') }}" style="font-size: 0.85rem;">My Appointments &rarr;</a>
    </div>

    <form action="{{ url_for('book_appointment') }}" method="POST">
      <!-- Select Doctor -->
      <div class="form-group">
        <label for="doctor_id" class="form-label">Select Attending Doctor *</label>
        <select class="form-select" id="doctor_id" name="doctor_id" required autofocus>
          <option value="" disabled {% if not form.get('doctor_id') %}selected{% endif %}>Choose a physician...</option>
          {% for doc in doctors %}
            <option value="{{ doc.user_id }}" {% if form.get('doctor_id') == doc.user_id %}selected{% endif %}>
              {{ doc.name }} ({{ doc.phone or 'General Service' }})
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Date & Time -->
      <div class="form-row">
        <div class="form-group">
          <label for="appointment_date" class="form-label">Consultation Date *</label>
          <input type="date" class="form-control" id="appointment_date" name="appointment_date" value="{{ form.get('appointment_date', '') }}" required>
        </div>

        <div class="form-group">
          <label for="appointment_time" class="form-label">Consultation Time *</label>
          <select class="form-select" id="appointment_time" name="appointment_time" required>
            <option value="" disabled {% if not form.get('appointment_time') %}selected{% endif %}>Select Time Slot</option>
            <option value="09:00 AM" {% if form.get('appointment_time') == '09:00 AM' %}selected{% endif %}>09:00 AM</option>
            <option value="10:00 AM" {% if form.get('appointment_time') == '10:00 AM' %}selected{% endif %}>10:00 AM</option>
            <option value="11:00 AM" {% if form.get('appointment_time') == '11:00 AM' %}selected{% endif %}>11:00 AM</option>
            <option value="02:00 PM" {% if form.get('appointment_time') == '02:00 PM' %}selected{% endif %}>02:00 PM</option>
            <option value="03:00 PM" {% if form.get('appointment_time') == '03:00 PM' %}selected{% endif %}>03:00 PM</option>
            <option value="04:00 PM" {% if form.get('appointment_time') == '04:00 PM' %}selected{% endif %}>04:00 PM</option>
          </select>
        </div>
      </div>

      <!-- Reason for Consultation -->
      <div class="form-group">
        <label for="reason" class="form-label">Reason for Consultation / Chief Complaint *</label>
        <textarea class="form-control" id="reason" name="reason" rows="3" placeholder="Briefly describe your symptoms or reason for scheduling..." required>{{ form.get('reason', '') }}</textarea>
      </div>

      <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">
          Confirm &amp; Book Appointment &rarr;
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
