{% extends "base.html" %}

{% block title %}Sign In – MedTrack{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h1>Sign In to MedTrack</h1>
      <p>Access your patient portal or doctor workspace</p>
    </div>

    <!-- Evaluator Quick Switcher Box -->
    <div style="background: var(--bg-app); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.5rem;">
      <div style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem;">
        ⚡ Evaluator 1-Click Demo Login:
      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <a href="{{ url_for('demo_login', role='doctor') }}" class="btn btn-secondary btn-sm" style="flex: 1; text-align: center;">
          👨‍⚕️ Demo Doctor
        </a>
        <a href="{{ url_for('demo_login', role='patient') }}" class="btn btn-secondary btn-sm" style="flex: 1; text-align: center;">
          🧑‍🦱 Demo Patient
        </a>
      </div>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <!-- Email Address -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ form.get('email', '') if form else '' }}" required autofocus>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Sign In &rarr;
      </button>
    </form>

    <div class="auth-footer">
      New patient? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
