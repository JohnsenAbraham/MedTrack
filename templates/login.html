{% extends "base.html" %}

{% block title %}Sign In – MedTrack Clinical Portal{% endblock %}

{% block content %}
<div class="container auth-wrapper" style="max-width: 480px; margin: 3rem auto;">
  <div class="card auth-card" style="padding: 2.25rem;">
    <div class="auth-header" style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-badge" style="margin: 0 auto 0.85rem; width: 44px; height: 44px; font-size: 1.3rem;">+</div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.35rem;">Sign In to MedTrack</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin: 0;">Access your patient consultations, prescriptions, or clinical workspace</p>
    </div>

    <!-- Quick Demo Logins Box -->
    <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.25rem;">
      <div style="font-size: 0.74rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
        Quick Demo Sign In
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemo('patient.demo@medtrack.local', 'PatientPass123!')">
          {{ icons.icon_user(class="icon", size=14) }}
          <span>Patient Demo</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemo('doctor.vance@medtrack.local', 'DoctorPass123!')">
          {{ icons.icon_stethoscope(class="icon", size=14) }}
          <span>Doctor Demo</span>
        </button>
      </div>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <!-- Email Address -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ form.get('email', '') if form else '' }}" required autofocus>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Sign In &rarr;
      </button>
    </form>

    <div class="auth-footer" style="text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--text-muted);">
      New patient? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an account</a>
    </div>
  </div>
</div>

<script>
  function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
  }
</script>
{% endblock %}
