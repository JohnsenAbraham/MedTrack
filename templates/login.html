{% extends "base.html" %}

{% block title %}Sign In – MedTrack Clinical Portal{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <div style="font-size: 2rem; margin-bottom: 0.25rem;">✚</div>
      <h1>Sign In to MedTrack</h1>
      <p>Access your patient consultations, prescriptions, or clinical workspace</p>
    </div>

    <!-- Quick Demo Logins Box -->
    <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.25rem;">
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.04em;">
        Quick Demo Logins
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-outline btn-sm" style="flex: 1;" onclick="fillDemo('patient.demo@medtrack.local', 'PatientPass123!')">
          👤 Patient
        </button>
        <button type="button" class="btn btn-outline btn-sm" style="flex: 1;" onclick="fillDemo('doctor.vance@medtrack.local', 'DoctorPass123!')">
          👨‍⚕️ Doctor
        </button>
      </div>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <!-- Email Address -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ form.get('email', '') if form else '' }}" required autofocus>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Sign In &rarr;
      </button>
    </form>

    <div class="auth-footer">
      New patient? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
</div>

<script>
  function fillDemo(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
  }
</script>
{% endblock %}
