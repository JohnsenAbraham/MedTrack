{% extends "base.html" %}

{% block title %}Patient Registration – MedTrack{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h1>Patient Registration</h1>
      <p>Create your MedTrack patient account</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <!-- Full Name -->
      <div class="form-group">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" value="{{ form.get('name', '') }}" required autofocus>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ form.get('email', '') }}" required>
      </div>

      <!-- Password & Phone -->
      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Phone Number *</label>
          <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1-555-0199" value="{{ form.get('phone', '') }}" required>
        </div>
      </div>

      <!-- Date of Birth & Gender -->
      <div class="form-row">
        <div class="form-group">
          <label for="date_of_birth" class="form-label">Date of Birth *</label>
          <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ form.get('date_of_birth', '') }}" required>
        </div>
        <div class="form-group">
          <label for="gender" class="form-label">Gender *</label>
          <select class="form-select" id="gender" name="gender" required>
            <option value="" disabled {% if not form.get('gender') %}selected{% endif %}>Select Gender</option>
            <option value="Male" {% if form.get('gender') == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if form.get('gender') == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if form.get('gender') == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Complete Registration &rarr;
      </button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="{{ url_for('login') }}">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
