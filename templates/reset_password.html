{% extends "base.html" %}

{% block title %}Set New Password | MedTrack{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <h1>Set New Password</h1>
        <p>Create a secure new password for <strong>{{ email }}</strong></p>
      </div>

      <form action="{{ url_for('reset_password', token=token) }}" method="POST" id="resetPasswordForm">
        <!-- New Password -->
        <div class="form-group">
          <label for="password" class="form-label">New Password <span class="required">*</span></label>
          <div class="password-input-group">
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password (minimum 6 characters)" required autofocus>
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility" title="Show/Hide password">
              👁️
            </button>
          </div>
          <div class="form-hint">Password must contain at least 6 characters.</div>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm New Password <span class="required">*</span></label>
          <div class="password-input-group">
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
            <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Toggle password visibility" title="Show/Hide password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem;" id="submitResetBtn">
          Save New Password &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Cancel and return to <a href="{{ url_for('login') }}">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
